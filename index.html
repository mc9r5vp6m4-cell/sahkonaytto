<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pörssisähkö</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    height:100vh;
    color:white;
    transition:background-color .4s;
    overflow:hidden;
}

.container{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    padding:20px;
}

.price{
    font-size:clamp(5rem,15vw,12rem);
    font-weight:900;
    line-height:1;
}

.unit{
    font-size:2rem;
    opacity:.9;
}

.status{
    font-size:3rem;
    font-weight:700;
    margin-top:10px;
}

.message{
    font-size:1.8rem;
    margin-top:10px;
}

.top-right{
    position:absolute;
    top:20px;
    right:25px;
    text-align:right;
}

.clock{
    font-size:1.1rem;
}

.next-price{
    margin-top:8px;
    font-size:1.6rem;
    font-weight:bold;
}

.arrow{
    font-size:3rem;
    font-weight:bold;
}

#trendText{
    font-weight:bold;
    font-size:1rem;
    margin-top:5px;
}

.bottom{
    position:absolute;
    bottom:20px;
    width:100%;
    padding:0 20px;
}

.chart{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:170px;
}

.bar{
    flex:1;
    border-radius:4px 4px 0 0;
    position:relative;
}

.current-marker{
    position:absolute;
    width:30px;
    height:30px;
    top:-38px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    border-radius:4px;
}

.price-label{
    position:absolute;
    top:-22px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    font-size:12px;
    font-weight:700;
    color:white;
    text-shadow:1px 1px 3px rgba(0,0,0,.6);
}
</style>
</head>

<body>

<div class="top-right">
    <div class="clock" id="clock"></div>

    <div class="next-price">
        Seuraava tunti:
        <span id="nextHour">--</span>
    </div>

    <div class="arrow" id="arrow">➡️</div>
    <div id="trendText"></div>
</div>

<div class="container">
    <div class="price" id="price">--</div>
    <div class="unit">snt/kWh</div>

    <div class="status" id="status">Ladataan...</div>
    <div class="message" id="message"></div>
</div>

<div class="bottom">
    <div class="chart" id="chart"></div>
</div>

<script>

let lastGoodState = null;

function updateClock(){
    document.getElementById("clock").innerText =
        new Date().toLocaleString("fi-FI");
}

setInterval(updateClock,1000);
updateClock();

function getLevel(price){

    if(price <= 5){
        return {
            color:"#0f9d58",
            status:"VAPAA KULUTUS",
            message:"Tee mitä haluat"
        };
    }

    if(price <= 10){
        return {
            color:"#43a047",
            status:"NORMAALI KÄYTTÖ",
            message:"Normaali käyttö"
        };
    }

    if(price <= 20){
        return {
            color:"#fbc02d",
            status:"HARKITTU KÄYTTÖ",
            message:"Siirrä kodinkonehommat, jos mahdollista"
        };
    }

    if(price <= 30){
        return {
            color:"#ef6c00",
            status:"KALLISTA SÄHKÖÄ",
            message:"Vältä pitkiä suihkuja ja pesukoneita"
        };
    }

    return {
        color:"#c62828",
        status:"SÄÄSTÖTILA",
        message:"Vain välttämättömät laitteet"
    };
}

function barColor(price){

    if(price <= 5) return "#00e676";
    if(price <= 10) return "#66bb6a";
    if(price <= 20) return "#ffee58";
    if(price <= 30) return "#ff9800";

    return "#ef5350";
}

function drawChart(hours){

    const chart =
        document.getElementById("chart");

    chart.innerHTML="";

    const max =
        Math.max(...hours.map(h=>h.price),5);

    const currentHour =
        new Date().getHours();

    const cheapestPrice =
        Math.min(...hours.map(h=>h.price));

    const expensivePrice =
        Math.max(...hours.map(h=>h.price));

    hours.forEach(h=>{

        const bar =
            document.createElement("div");

        bar.className="bar";

        let height =
            (h.price/max)*100;

        height =
            Math.max(height,5);

        bar.style.height=
            height+"%";

        bar.style.background=
            barColor(h.price);

        bar.title=
            `${h.hour}:00 - ${h.price.toFixed(1)} snt/kWh;

        if(
            h.price === cheapestPrice ||
            h.price === expensivePrice
        ){
            const label =
                document.createElement("div");

            label.className="price-label";
            label.innerText=
                `${h.price.toFixed(1)} snt`;

            bar.appendChild(label);
        }

        if(h.hour === currentHour){

            const marker =
                document.createElement("img");

            marker.src = "creeper.jpg";
            marker.className = "current-marker";

            bar.appendChild(marker);
        }

        chart.appendChild(bar);
    });
}

async function loadData(){

    try{

        const response =
            await fetch(
                "https://sahkonhintahuomenna.fi/api/v1/fi/today.json",
                { cache:"no-store" }
            );

        const data =
            await response.json();

        const prices =
            data?.prices || [];

        const currentHour =
            new Date().getHours();

        const hourly=[];

        for(let h=0; h<24; h++){

            const hourRows =
                prices.filter(p=>{

                    const d =
                        new Date(p.start);

                    return d.getHours()===h;
                });

            if(hourRows.length){

                const avg =
                    hourRows.reduce(
                        (a,b)=>
                            a+b.cents_per_kWh_incl_vat,
                        0
                    ) / hourRows.length;

                hourly.push({
                    hour:h,
                    price:avg
                });
            }
        }

        const current =
            hourly.find(
                x=>x.hour===currentHour
            );

        if(!current){

            console.warn(
                "Nykyisen tunnin data puuttuu."
            );

            document.getElementById("status")
                .innerText =
                "Odotetaan uuden vuorokauden hintatietoja";

            return;
        }

        const next =
            hourly.find(
                x=>x.hour===((currentHour+1)%24)
            );

        const level =
            getLevel(current.price);

        document.body.style.backgroundColor =
            level.color;

        document.getElementById("price").innerText =
            current.price.toFixed(1);

        document.getElementById("status").innerText =
            level.status;

        document.getElementById("message").innerText =
            level.message;

        if(next){

            document.getElementById("nextHour").innerText =
                next.price.toFixed(1)+" snt";

            const diff =
                next.price-current.price;

            let arrow="➡️";
            let text="ENNALLAAN";
            let color="white";

            if(diff > 0.5){
                arrow="⬆️";
                text=`KALLISTUU +${diff.toFixed(1)} snt`;
                color="#ff5555";
            }

            if(diff < -0.5){
                arrow="⬇️";
                text=`HALPENEE ${diff.toFixed(1)} snt`;
                color="#00ff66";
            }

            document.getElementById("arrow").innerText =
                arrow;

            document.getElementById("arrow").style.color =
                color;

            document.getElementById("trendText").innerText =
                text;

            document.getElementById("trendText").style.color =
                color;
        }

        drawChart(hourly);

        lastGoodState =
            Date.now();

    }
    catch(err){

        console.error(err);

        if(lastGoodState){

            document.getElementById("status")
                .innerText =
                "Käytetään viimeisintä saatavilla olevaa hintatietoa";

        }else{

            document.getElementById("status")
                .innerText =
                "Hintadatan lataus epäonnistui";
        }
    }
}

loadData();

/* normaali päivitys */
setInterval(loadData,300000);

/* lisähaku 30 sekunnin kuluttua sivun avauksesta */
setTimeout(loadData,30000);

/* tasatunnin läheisyydessä uusi haku */
setInterval(() => {

    const now = new Date();

    if(
        now.getMinutes() === 0 &&
        now.getSeconds() < 15
    ){
        loadData();
    }

},1000);

</script>

</body>
</html>
